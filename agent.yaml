spec_version: "0.1.0"
name: forgemind-ai
version: "1.0.0"
description: >
  ForgeMind AI is an evidence-grounded predictive maintenance and
  decision-support agent for rail infrastructure. It connects inspection,
  usage, failure, maintenance, work-order, engineering, and compliance
  evidence to produce explainable maintenance intelligence while keeping
  final decision authority with human engineers.